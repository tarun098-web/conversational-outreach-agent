[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "conversational-outreach-agent"
version = "0.1.0"
description = "Evaluation-first, human-controlled conversational outreach agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tarun Dande" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "groq>=0.18,<1",
  "supabase>=2.9,<3",
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
outreach-eval = "outreach_agent.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["code/outreach_agent"]

[tool.pytest.ini_options]
testpaths = ["test_suite"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["outreach_agent"]
exclude = ["test_suite"]
